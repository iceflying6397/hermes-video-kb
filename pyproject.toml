[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-video-kb"
version = "2.1.0"
description = "Local video knowledge helper using official Notion OAuth"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "jsonschema==4.26.0"]

[project.scripts]
video-kb = "video_kb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
